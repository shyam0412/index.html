<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FitForge</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f7;--white:#ffffff;--card:#ffffff;
  --primary:#1db954;--primary-dark:#17a347;--primary-light:#e8f8ee;
  --accent:#ff6b35;--accent-light:#fff0ea;
  --text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--shadow:0 2px 16px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:16px;--radius-sm:10px;--radius-xs:8px;
  --font:'Nunito',sans-serif;--font2:'Nunito Sans',sans-serif;
  --nav-h:72px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}
/* SCREENS */
.screen{display:none;min-height:100vh;flex-direction:column;animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.screen.active{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(0.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,185,84,0.4)}70%{box-shadow:0 0 0 10px rgba(29,185,84,0)}}
@keyframes checkIn{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes ringFill{from{stroke-dashoffset:283}to{stroke-dashoffset:0}}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;transition:all 0.2s;border-radius:50px;letter-spacing:0.3px}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--primary);color:#fff;padding:16px 32px;font-size:16px;box-shadow:0 4px 16px rgba(29,185,84,0.35)}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 6px 20px rgba(29,185,84,0.45)}
.btn-secondary{background:var(--white);color:var(--text);padding:14px 28px;font-size:15px;border:1.5px solid var(--border)}
.btn-ghost{background:transparent;color:var(--text2);padding:10px 20px;font-size:14px}
.btn-icon{width:44px;height:44px;border-radius:50%;background:var(--white);border:1.5px solid var(--border);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s}
.btn-icon:active{transform:scale(0.92);background:var(--bg)}

/* HEADER */
.app-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:100}
.header-logo{font-size:22px;font-weight:900;color:var(--primary);letter-spacing:-0.5px}
.header-user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#0ea847);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:14px}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--white);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;cursor:pointer;border-radius:var(--radius-sm);transition:all 0.2s;border:none;background:none;font-family:var(--font)}
.nav-item.active .nav-icon{background:var(--primary-light);color:var(--primary)}
.nav-item.active .nav-label{color:var(--primary);font-weight:700}
.nav-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all 0.25s;color:var(--text3);background:transparent}
.nav-label{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.scroll-body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 16px)}

/* CARDS */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:20px}

/* ONBOARDING */
.onboard-wrap{flex:1;display:flex;flex-direction:column;padding:24px 20px;max-width:480px;margin:0 auto;width:100%}
.onboard-progress{display:flex;gap:6px;margin-bottom:32px}
.onboard-dot{height:5px;border-radius:3px;background:var(--border);flex:1;transition:all 0.4s}
.onboard-dot.active{background:var(--primary)}
.onboard-dot.done{background:var(--primary);opacity:0.4}
.step-tag{display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;padding:6px 14px;border-radius:50px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.step-heading{font-size:32px;font-weight:900;color:var(--text);line-height:1.1;margin-bottom:8px}
.step-sub{font-size:15px;color:var(--text2);margin-bottom:28px;font-family:var(--font2)}
.choice-grid{display:grid;gap:12px}
.choice-grid.cols2{grid-template-columns:1fr 1fr}
.choice-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:18px 16px;cursor:pointer;transition:all 0.2s;position:relative;text-align:left}
.choice-card:hover{border-color:var(--primary);background:var(--primary-light)}
.choice-card.selected{border-color:var(--primary);background:var(--primary-light)}
.choice-card.selected::after{content:'✓';position:absolute;top:12px;right:14px;color:var(--primary);font-size:16px;font-weight:800}
.choice-icon{font-size:28px;margin-bottom:8px}
.choice-name{font-size:15px;font-weight:800;color:var(--text)}
.choice-desc{font-size:12px;color:var(--text2);margin-top:3px;font-family:var(--font2)}
.choice-row{display:flex;align-items:center;gap:12px}
.choice-row .choice-icon{font-size:22px;margin:0}
.slider-wrap{margin-bottom:24px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.slider-key{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
.slider-val{font-size:28px;font-weight:900;color:var(--primary)}
.slider-unit{font-size:14px;color:var(--text2);font-weight:600;margin-left:2px}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;background:var(--border);border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 8px rgba(29,185,84,0.4);border:3px solid white}
.name-input{width:100%;padding:16px 20px;font-size:18px;font-weight:700;font-family:var(--font);border:2px solid var(--border);border-radius:var(--radius);background:var(--white);color:var(--text);outline:none;transition:border-color 0.2s}
.name-input:focus{border-color:var(--primary)}
.nav-row{display:flex;gap:12px;margin-top:24px}

/* HOME SCREEN */
.hero-card{background:linear-gradient(135deg,#1db954,#0ea847);border-radius:var(--radius);padding:24px;margin:16px 20px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(29,185,84,0.3)}
.hero-card::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%}
.hero-card::after{content:'';position:absolute;right:30px;bottom:-30px;width:80px;height:80px;background:rgba(255,255,255,0.07);border-radius:50%}
.hero-greeting{font-size:14px;color:rgba(255,255,255,0.8);font-weight:600;margin-bottom:4px}
.hero-name{font-size:26px;font-weight:900;color:white;margin-bottom:16px}
.hero-meta{display:flex;gap:16px;margin-bottom:20px}
.hero-stat{background:rgba(255,255,255,0.2);border-radius:var(--radius-sm);padding:10px 14px;backdrop-filter:blur(4px)}
.hero-stat-val{font-size:20px;font-weight:900;color:white}
.hero-stat-label{font-size:11px;color:rgba(255,255,255,0.8);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.start-workout-btn{background:white;color:var(--primary);border:none;padding:14px 24px;border-radius:50px;font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;font-family:var(--font)}
.start-workout-btn:active{transform:scale(0.96)}

.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:12px}
.section-title{font-size:18px;font-weight:900;color:var(--text)}
.see-all{font-size:13px;font-weight:700;color:var(--primary);cursor:pointer}

/* WEEK STRIP */
.week-strip{display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.week-strip::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s;border:2px solid transparent;background:var(--white)}
.day-chip.today{border-color:var(--primary);background:var(--primary-light)}
.day-chip.done{background:var(--primary);border-color:var(--primary)}
.day-chip.done .day-num{color:white}
.day-chip.done .day-name{color:rgba(255,255,255,0.8)}
.day-chip.today .day-num{color:var(--primary)}
.day-chip.today .day-name{color:var(--primary)}
.day-num{font-size:18px;font-weight:900;color:var(--text)}
.day-name{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px}
.day-dot{width:5px;height:5px;border-radius:50%}
.day-chip.done .day-dot{background:rgba(255,255,255,0.7)}
.day-chip.today .day-dot{background:var(--primary)}
.day-chip:not(.done):not(.today) .day-dot{background:var(--border)}

/* WORKOUT CARDS */
.workout-list{padding:0 20px;display:flex;flex-direction:column;gap:12px}
.ex-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.25s;border:2px solid transparent;position:relative;overflow:hidden}
.ex-card:active{transform:scale(0.98);border-color:var(--primary)}
.ex-card.completed{border-color:var(--primary);background:var(--primary-light)}
.ex-card.completed::after{content:'✓';position:absolute;top:14px;right:16px;width:28px;height:28px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;animation:checkIn 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.ex-emoji-wrap{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ex-card-body{flex:1;min-width:0}
.ex-card-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
.ex-card-meta{display:flex;gap:12px;font-size:12px;color:var(--text2);font-family:var(--font2);font-weight:600}
.ex-card-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ex-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px}
.tag-warmup{background:#e0f2fe;color:#0369a1}
.tag-main{background:#fef3c7;color:#d97706}
.tag-cool{background:#dcfce7;color:#15803d}
.tag-cardio{background:#fce7f3;color:#be185d}

/* DETAIL SCREEN */
.detail-hero{height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.detail-hero-emoji{font-size:90px;animation:bounce 2s ease-in-out infinite}
.detail-info{padding:20px;flex:1;overflow-y:auto;padding-bottom:100px}
.detail-name{font-size:28px;font-weight:900;color:var(--text);margin-bottom:8px}
.detail-badges{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.detail-badge{font-size:12px;font-weight:700;padding:6px 14px;border-radius:50px;text-transform:uppercase;letter-spacing:0.5px}
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.metric-box{background:var(--bg);border-radius:var(--radius-sm);padding:14px;text-align:center}
.metric-val{font-size:24px;font-weight:900;color:var(--text)}
.metric-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.video-btn{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#ff0000,#cc0000);border-radius:var(--radius);padding:18px 20px;margin-bottom:24px;cursor:pointer;text-decoration:none;transition:all 0.2s;box-shadow:0 4px 16px rgba(255,0,0,0.25)}
.video-btn:active{transform:scale(0.98)}
.play-circle{width:48px;height:48px;background:rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.play-tri{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:18px solid white;margin-left:4px}
.video-btn-text{color:white}
.video-btn-title{font-size:15px;font-weight:800}
.video-btn-sub{font-size:12px;opacity:0.8;margin-top:2px;font-family:var(--font2)}
.steps-section{margin-bottom:24px}
.steps-heading{font-size:17px;font-weight:900;color:var(--text);margin-bottom:14px}
.step-row{display:flex;gap:14px;margin-bottom:14px;align-items:flex-start}
.step-badge{width:28px;height:28px;border-radius:50%;background:var(--primary);color:white;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.step-text{font-size:14px;color:var(--text);line-height:1.6;font-family:var(--font2);font-weight:600}
.tips-box{background:linear-gradient(135deg,#fef3c7,#fde68a20);border:1.5px solid #fde68a;border-radius:var(--radius);padding:18px;margin-bottom:24px}
.tips-heading{font-size:13px;font-weight:800;color:#d97706;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.tip-row{display:flex;gap:10px;margin-bottom:8px;font-size:13px;color:#92400e;line-height:1.5;font-family:var(--font2);font-weight:600}
.tip-row::before{content:'💡';flex-shrink:0}
.done-btn{width:calc(100% - 40px);margin:0 20px 20px;background:var(--primary);color:white;border:none;padding:18px;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);box-shadow:0 6px 20px rgba(29,185,84,0.35);transition:all 0.2s;animation:pulse 2s infinite}
.done-btn:active{transform:scale(0.97)}

/* TIMER */
.timer-hero{background:linear-gradient(135deg,#1db954,#0ea847);padding:40px 24px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.timer-hero::before{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:rgba(255,255,255,0.1);border-radius:50%}
.timer-ring-wrap{position:relative;width:180px;height:180px;margin-bottom:24px}
.timer-ring-wrap svg{transform:rotate(-90deg)}
.timer-ring-wrap circle{fill:none;stroke-width:10;stroke-linecap:round}
.timer-track{stroke:rgba(255,255,255,0.2)}
.timer-prog{stroke:white;stroke-dasharray:502;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px rgba(255,255,255,0.5))}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-num{font-size:48px;font-weight:900;color:white;letter-spacing:-1px}
.timer-status-txt{font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);text-transform:uppercase;letter-spacing:1px}
.timer-ctrls{display:flex;gap:14px;align-items:center}
.ctrl-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all 0.2s}
.ctrl-btn:active{transform:scale(0.92)}
.ctrl-main{width:70px;height:70px;font-size:28px;background:white;color:var(--primary);box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.ctrl-side{background:rgba(255,255,255,0.2);color:white;backdrop-filter:blur(4px)}
.presets-wrap{padding:20px}
.presets-title{font-size:14px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.preset-chip{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;cursor:pointer;transition:all 0.2s}
.preset-chip.active,.preset-chip:hover{border-color:var(--primary);background:var(--primary-light)}
.preset-chip-val{font-size:18px;font-weight:900;color:var(--text)}
.preset-chip-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.preset-chip.active .preset-chip-val,.preset-chip.active .preset-chip-label{color:var(--primary)}

/* PROGRESS */
.progress-hero{background:linear-gradient(135deg,#667eea,#764ba2);padding:24px 20px;position:relative;overflow:hidden}
.progress-hero::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%}
.progress-hero-title{font-size:14px;color:rgba(255,255,255,0.8);font-weight:700;margin-bottom:4px;position:relative;z-index:1}
.progress-hero-val{font-size:40px;font-weight:900;color:white;position:relative;z-index:1}
.progress-hero-sub{font-size:13px;color:rgba(255,255,255,0.7);margin-top:4px;font-family:var(--font2);position:relative;z-index:1}
.progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px}
.p-stat{background:var(--white);border-radius:var(--radius-sm);padding:16px;text-align:center;box-shadow:var(--shadow)}
.p-stat-val{font-size:26px;font-weight:900;color:var(--text)}
.p-stat-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.cal-wrap{padding:0 20px 20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-header-cell{text-align:center;font-size:10px;font-weight:800;color:var(--text2);padding:4px 0;text-transform:uppercase}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);background:var(--white);border:1.5px solid var(--border);transition:all 0.2s}
.cal-cell.today{border-color:var(--primary);color:var(--primary)}
.cal-cell.done{background:var(--primary);border-color:var(--primary);color:white}
.cal-cell.empty{background:transparent;border-color:transparent}
.bar-chart{padding:0 20px 20px}
.bar-chart-row{display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:6px}
.bar{flex:1;border-radius:6px 6px 0 0;min-height:4px;transition:height 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.bar.active{background:linear-gradient(180deg,var(--primary),#0ea847)}
.bar.inactive{background:var(--border)}
.bar-labels{display:flex;gap:8px}
.bar-label{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--text2)}
.log-list{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.log-item{background:var(--white);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.log-name{font-size:14px;font-weight:800;color:var(--text)}
.log-date{font-size:12px;color:var(--text2);font-family:var(--font2);margin-top:2px}
.log-cal{font-size:13px;font-weight:800;color:var(--primary)}

/* NUTRITION */
.nut-hero{background:linear-gradient(135deg,#f093fb,#f5576c);padding:24px 20px;position:relative;overflow:hidden}
.nut-hero::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%}
.nut-hero-title{font-size:26px;font-weight:900;color:white;margin-bottom:4px;position:relative;z-index:1}
.nut-hero-sub{font-size:13px;color:rgba(255,255,255,0.8);font-family:var(--font2);position:relative;z-index:1}
.macro-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 20px}
.macro-card{background:var(--white);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.macro-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:16px}
.macro-val{font-size:18px;font-weight:900;color:var(--text)}

function save() {
  try {
    localStorage.setItem('ff_user', JSON.stringify(USER));
    localStorage.setItem('ff_progress', JSON.stringify(PROGRESS));
    localStorage.setItem('ff_day', activeDay);
    localStorage.setItem('ff_completed_exs', JSON.stringify([...completedExercises]));
  } catch(e){}
}
function load() {
  try {
    const u = localStorage.getItem('ff_user');
    const p = localStorage.getItem('ff_progress');
    const d = localStorage.getItem('ff_day');
    const ce = localStorage.getItem('ff_completed_exs');
    if (u) USER = JSON.parse(u);
    if (p) PROGRESS = JSON.parse(p);
    if (d) activeDay = parseInt(d) || 0;
    if (ce) completedExercises = new Set(JSON.parse(ce));
  } catch(e){}
}

function finishOnboard() {
  USER = { ...tempUser };
  PROGRESS = { log:[], streak:0, totalCal:0, totalEx:0, completedDays:[] };
  activeDay = 0;
  completedExercises = new Set();
  save();
  launchApp();
}

// ════════════════════════════════════ APP ════════════════════════════════════
function launchApp() {
  showScreen('s-app');
  document.getElementById('app-avatar').textContent = USER.name.charAt(0).toUpperCase();
  document.getElementById('streak-num').textContent = PROGRESS.streak + ' day' + (PROGRESS.streak!==1?'s':'');
  renderHome();
  renderNutrition();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function switchTab(name) {
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  ['home','timer','progress','nutrition'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===name?'block':'none';
  });
  if (name==='progress') renderProgress();
}

function renderHome() {
  const g = USER.goal||'general';
  const plan = PLANS[g];
  const todayPlan = plan[activeDay % plan.length];
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const cal = Math.round(USER.weight * 5.5);

  // week strip - 7 days
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = now.getDay();
  let weekHtml = '';
  for (let i=0; i<7; i++) {
    const diff = i - today;
    const d = new Date(now); d.setDate(d.getDate()+diff);
    const dateNum = d.getDate();
    const isToday = diff===0;
    const isDone = PROGRESS.completedDays && PROGRESS.completedDays.includes(d.toDateString());
    weekHtml += `<div class="day-chip ${isToday?'today':''} ${isDone?'done':''}">
      <div class="day-name">${days[d.getDay()].slice(0,3)}</div>
      <div class="day-num">${dateNum}</div>
      <div class="day-dot"></div>
    </div>`;
  }

  // exercise list
  const exHtml = todayPlan.exs.map((k,i)=>{
    const ex = EX[k]; if(!ex) return '';
    const done = completedExercises.has(k);
    const tagClass = {warmup:'tag-warmup',main:'tag-main',cool:'tag-cool',cardio:'tag-cardio'}[ex.tag]||'tag-main';
    const tagLabel = {warmup:'Warm-Up',main:'Main',cool:'Cool Down',cardio:'Cardio'}[ex.tag]||'Main';
    return `<div class="ex-card ${done?'completed':''}" data-ex="${k}" style="animation-delay:${i*0.06}s;animation:slideUp 0.4s ${i*0.06}s both cubic-bezier(0.34,1.56,0.64,1)">

// ════════════════════════════════════ COMPLETE ════════════════════════════════
function completeWorkout() {
  const today = new Date().toDateString();
  if (PROGRESS.completedDays && PROGRESS.completedDays.includes(today)) {
    showToast('Already logged today! Come back tomorrow 💪'); return;
  }
  const cal = Math.round(USER.weight * 5.5);
  const plan = PLANS[USER.goal||'general'];
  const todayPlan = plan[activeDay % plan.length];

  if (!PROGRESS.completedDays) PROGRESS.completedDays = [];
  PROGRESS.completedDays.push(today);
  PROGRESS.log.unshift({ date:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'}), workout:todayPlan.name, day:activeDay+1, exercises:todayPlan.exs.length, cal });
  PROGRESS.totalCal += cal;
  PROGRESS.totalEx += todayPlan.exs.length;
  PROGRESS.streak++;
  activeDay++;
  completedExercises = new Set();

  document.getElementById('streak-num').textContent = PROGRESS.streak + ' day' + (PROGRESS.streak!==1?'s':'');
  document.getElementById('c-ex').textContent = todayPlan.exs.length;
  document.getElementById('c-cal').textContent = cal;
  document.getElementById('c-streak').textContent = PROGRESS.streak;
  document.getElementById('complete-msg').textContent = PROGRESS.streak===1 ? 'First workout done! The journey begins.' : `${PROGRESS.streak} days strong, ${USER.name}! Keep going!`;

  save();
  document.getElementById('complete-overlay').classList.add('show');
}

// ════════════════════════════════════ PROGRESS ════════════════════════════════
function renderProgress() {
  const calTrend = [0,0,0,0,0,0,0];
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const now = new Date();
  (PROGRESS.log||[]).slice(0,7).forEach((l,i)=>{ if(i<7) calTrend[6-i]=l.cal||0; });
  const maxCal = Math.max(...calTrend,1);
  const bars = calTrend.map((c,i)=>`<div class="bar ${c>0?'active':'inactive'}" style="height:${Math.max(8,c/maxCal*80)}px"></div>`).join('');
  const barLabels = days.map(d=>`<div class="bar-label">${d}</div>`).join('');

  // calendar
  const yr=now.getFullYear(),mo=now.getMonth();
  const first=new Date(yr,mo,1).getDay(), dim=new Date(yr,mo+1,0).getDate();
  const calDays=['S','M','T','W','T','F','S'].map(d=>`<div class="cal-header-cell">${d}</div>`).join('');
  let calCells = '';
  for(let i=0;i<first;i++) calCells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const dateStr=new Date(yr,mo,d).toDateString();
    const isToday=d===now.getDate();
    const isDone=PROGRESS.completedDays?.includes(dateStr);
    calCells+=`<div class="cal-cell ${isToday?'today':''} ${isDone?'done':''}">${d}</div>`;
  }

  const logHtml = (PROGRESS.log||[]).length ? (PROGRESS.log||[]).map(e=>`
    <div class="log-item">
      <div><div class="log-name">Day ${e.day||'?'} — ${e.workout||'Workout'}</div><div class="log-date">${e.date}</div></div>
      <div class="log-cal">${e.cal} kcal</div>
    </div>`).join('') : `<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No workouts logged yet.<br>Complete your first session!</div></div>`;

  document.getElementById('tab-progress').innerHTML = `
    <div class="progress-hero">
      <div class="progress-hero-title">Current Streak</div>
      <div class="progress-hero-val">🔥 ${PROGRESS.streak} ${PROGRESS.streak===1?'Day':'Days'}</div>
      <div class="progress-hero-sub">Keep going, ${USER?.name||'Champion'}!</div>
    </div>
    <div class="progress-stats">
      <div class="p-stat"><div class="p-stat-val">${PROGRESS.log?.length||0}</div><div class="p-stat-label">Workouts</div></div>
      <div class="p-stat"><div class="p-stat-val">${PROGRESS.totalCal||0}</div><div class="p-stat-label">Calories</div></div>
      <div class="p-stat"><div class="p-stat-val">${PROGRESS.totalEx||0}</div><div class="p-stat-label">Exercises</div></div>
    </div>
    <div class="cal-wrap">
      <div class="section-title" style="margin-bottom:12px">This Month</div>
      <div class="cal-grid">${calDays}${calCells}</div>
    </div>
    <div class="bar-chart">
      <div class="section-title" style="margin-bottom:12px">Weekly Calories</div>
      <div class="bar-chart-row">${bars}</div>
      <div class="bar-labels">${barLabels}</div>
    </div>
    <div class="section-header"><div class="section-title">Workout Log</div></div>
    <div class="log-list">${logHtml}</div>`;
}

// ════════════════════════════════════ NUTRITION ═══════════════════════════════
function renderNutrition() {
  const g = USER.goal||'general', s = USER.sex||'male', w=USER.weight||70, h=USER.height||170, a=USER.age||25;
  const diet = USER.diet||'nonveg';
  let bmr = s==='male'?(88.36+13.4*w+4.8*h-5.7*a):(447.6+9.2*w+3.1*h-4.3*a);
  let tdee=Math.round(bmr*1.55), cal=tdee, protein=Math.round(w*2), fat=Math.round(w*0.8);
  if(g==='lose_weight'){cal=Math.round(tdee*0.82);fat=Math.round(w*0.7);}
  if(g==='gain_muscle'){cal=Math.round(tdee*1.12);protein=Math.round(w*2.2);}
  let carb=Math.round((cal-protein*4-fat*9)/4);if(carb<50)carb=50;

  const dietLabels={nonveg:'🍗 Non-Veg',egg:'🥚 Eggetarian',veg:'🥗 Vegetarian',vegan:'🌱 Vegan',jain:'🙏 Jain'};
  const dietColors={nonveg:'#ff6b35',egg:'#f59e0b',veg:'#10b981',vegan:'#06b6d4',jain:'#8b5cf6'};
  const dietColor = dietColors[diet]||'#10b981';

  const mealSlots = [
    {key:'breakfast',label:'Breakfast',emoji:'🌅',always:true},
    {key:'lunch',label:'Lunch',emoji:'☀️',always:true},
    {key:'snack',label:'Snack',emoji:'🥜',always:true},
    {key:'post_workout',label:'Post-Workout',emoji:'🏋️',always:false},
    {key:'dinner',label:'Dinner',emoji:'🌙',always:true}
  ];

  function mealCard(slot) {
    const db = MEALS_DB[slot.key];
    if(!db||!db.length) return '';
    // Show all options (3 alternatives per meal)
    const mainOpt = db[0].options[diet]||db[0].options['veg'];
    const ytSearch = encodeURIComponent(mainOpt.name + ' recipe');
    const ytUrl = `https://www.youtube.com/shorts/${mainOpt.recipe}`;
    const ytSearchUrl = `https://www.youtube.com/results?search_query=${ytSearch}+recipe+shorts`;
    return `
    <div class="nut-meal-card" id="meal-${slot.key}">
      <div class="nut-meal-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:18px">${slot.emoji}</span>
          <span class="meal-time-badge">${slot.label}</span>
        </div>
        <div class="nut-macros-mini">
          <span style="color:#ef4444">🔥${mainOpt.cal}</span>
          <span style="color:#3b82f6">P${mainOpt.p}g</span>
        </div>
      </div>
      <div class="nut-meal-name">${mainOpt.name}</div>
      <div class="nut-meal-desc">${mainOpt.desc}</div>
      <div class="nut-pill-row">
        <span class="nut-pill cal-pill">🔥 ${mainOpt.cal} kcal</span>
        <span class="nut-pill p-pill">🥩 ${mainOpt.p}g P</span>
        <span class="nut-pill c-pill">🍚 ${mainOpt.c}g C</span>
        <span class="nut-pill f-pill">🥑 ${mainOpt.f}g F</span>
      </div>
      <div class="nut-action-row">
        <a href="${ytSearchUrl}" target="_blank" class="nut-action-btn yt-btn">
          <span style="font-size:16px">▶</span>
          <span>Recipe Video</span>
        </a>
        <a href="${mainOpt.zomato}" target="_blank" class="nut-action-btn zomato-btn">
          <span style="font-size:16px">🍽️</span>
          <span>Zomato</span>
        </a>
        <a href="${mainOpt.swiggy}" target="_blank" class="nut-action-btn swiggy-btn">
          <span style="font-size:16px">🛵</span>
          <span>Swiggy</span>
        </a>
      </div>
    </div>`;
  }

  const mealsHtml = mealSlots.map(s=>mealCard(s)).join('');
  const dietTips = (DIET_TIPS[diet]||[]).concat(GENERAL_NUT_TIPS[g]||[]);
  const tipsHtml = dietTips.map(t=>`<div class="nut-tip"><span>💡</span><div class="nut-tip-text">${t}</div></div>`).join('');

  // Diet preference switcher
  const dietOptions = Object.entries({nonveg:'🍗 Non-Veg',egg:'🥚 Egg',veg:'🥗 Veg',vegan:'🌱 Vegan',jain:'🙏 Jain'});
  const dietSwitcher = dietOptions.map(([k,l])=>`<button class="diet-chip ${USER.diet===k?'active':''}" data-diet="${k}">${l}</button>`).join('');

  document.getElementById('tab-nutrition').innerHTML = `
    <div class="nut-hero" style="background:linear-gradient(135deg,${dietColor},${dietColor}cc)">
      <div class="nut-hero-title">Your Nutrition Plan</div>
      <div class="nut-hero-sub">${GOALS[g]?.label||'Fitness'} goal · ${cal} kcal/day · ${dietLabels[diet]}</div>
    </div>
    <div style="padding:12px 20px 4px">
      <div style="font-size:12px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Diet Preference</div>
      <div style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px">${dietSwitcher}</div>

      <div class="macro-card"><div class="macro-circle" style="background:#e8f5e9;font-size:18px">🍚</div><div class="macro-val">${carb}g</div><div class="macro-label">Carbs</div></div>
      <div class="macro-card"><div class="macro-circle" style="background:#fce4ec;font-size:18px">🥑</div><div class="macro-val">${fat}g</div><div class="macro-label">Fat</div></div>
    </div>
    <div class="section-header"><div class="section-title">Today's Meals</div></div>
    <div class="meal-list">${mealsHtml}</div>
    <div class="section-header" style="margin-top:4px"><div class="section-title">Nutrition Tips</div></div>
    <div class="nut-tip-list">${tipsHtml}</div>
    <div style="height:16px"></div>`;

  // Diet switcher clicks
  document.querySelectorAll('.diet-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      USER.diet = btn.dataset.diet;
      save();
      renderNutrition();
      showToast(`Switched to ${btn.textContent} meals!`);
    });
  });
}

// ════════════════════════════════════ TIMER ═══════════════════════════════════
function fmtT(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60}
function updateRing(cur,tot){
  const circ=502, off=circ*(1-cur/tot);
  document.getElementById('timer-ring-el').style.strokeDashoffset=off;
}
function setTimer(s){
  if(TIMER.running){clearInterval(TIMER.interval);TIMER.running=false;document.getElementById('btn-toggle').textContent='▶';}
  TIMER.sec=s;TIMER.total=s;
  document.getElementById('timer-display').textContent=fmtT(s);
  document.getElementById('timer-status').textContent='READY';
  updateRing(s,s);
}
function startTimer(){
  if(TIMER.running)return;
  TIMER.running=true;
  document.getElementById('btn-toggle').textContent='⏸';
  document.getElementById('timer-status').textContent='RUNNING';
  TIMER.interval=setInterval(()=>{
    TIMER.sec--;
    if(TIMER.sec<=0){
      clearInterval(TIMER.interval);TIMER.running=false;
      document.getElementById('btn-toggle').textContent='▶';
      document.getElementById('timer-status').textContent='DONE! 🎉';
      document.getElementById('timer-display').textContent='0:00';
      updateRing(0,TIMER.total);
      showToast('Rest done! Time to crush the next set 💪');return;
    }
    document.getElementById('timer-display').textContent=fmtT(TIMER.sec);
    updateRing(TIMER.sec,TIMER.total);
  },1000);
}
function pauseTimer(){TIMER.running=false;clearInterval(TIMER.interval);document.getElementById('btn-toggle').textContent='▶';document.getElementById('timer-status').textContent='PAUSED';}
function resetTimer(){if(TIMER.running){clearInterval(TIMER.interval);TIMER.running=false;}TIMER.sec=TIMER.total;document.getElementById('btn-toggle').textContent='▶';document.getElementById('timer-display').textContent=fmtT(TIMER.total);document.getElementById('timer-status').textContent='READY';updateRing(TIMER.total,TIMER.total);}
function skipTimer(){clearInterval(TIMER.interval);TIMER.running=false;TIMER.sec=0;document.getElementById('timer-display').textContent='0:00';document.getElementById('timer-status').textContent='DONE! 🎉';document.getElementById('btn-toggle').textContent='▶';updateRing(0,TIMER.total);}

// ════════════════════════════════════ TOAST ═══════════════════════════════════
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ════════════════════════════════════ EVENTS ══════════════════════════════════
document.addEventListener('click',function(e){
  // choice cards
  const cc = e.target.closest('.choice-card[data-key]');
  if(cc){
    tempUser[cc.dataset.key]=cc.dataset.val;
    cc.closest('.choice-grid').querySelectorAll('.choice-card').forEach(c=>c.classList.remove('selected'));
    cc.classList.add('selected');
    return;
  }
  // nav tabs
  const nb = e.target.closest('[data-tab]');
  if(nb && nb.classList.contains('nav-item')){ switchTab(nb.dataset.tab); return; }
  // exercise cards
  const ec = e.target.closest('.ex-card[data-ex]');
  if(ec){ showDetail(ec.dataset.ex); return; }
  // preset chips
  const pc = e.target.closest('[data-secs]');
  if(pc){
    setTimer(parseInt(pc.dataset.secs));
    document.querySelectorAll('.preset-chip').forEach(c=>c.classList.remove('active'));
    pc.classList.add('active');
    return;
  }
  // detail back
  if(e.target.closest('#detail-back')){ showScreen('s-app'); renderHome(); return; }
  // complete close
  if(e.target.closest('#complete-close')){ document.getElementById('complete-overlay').classList.remove('show'); renderHome(); return; }
  // timer controls
  if(e.target.closest('#btn-toggle')){ TIMER.running?pauseTimer():startTimer(); return; }
  if(e.target.closest('#btn-reset')){ resetTimer(); return; }
  if(e.target.closest('#btn-skip')){ skipTimer(); return; }
});

load();
if(USER && USER.name) {
  launchApp();
} else {
  renderOnboardStep();
}
